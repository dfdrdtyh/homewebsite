<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            color: #f8fafc;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 40px 32px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-4px);
        }
        .avatar {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: linear-gradient(45deg, #38bdf8, #818cf8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            margin: 0 auto 20px;
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.3);
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        p.bio {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .clock {
            font-family: monospace;
            font-size: 20px;
            color: #38bdf8;
            background: rgba(15, 23, 42, 0.5);
            padding: 10px 18px;
            border-radius: 12px;
            margin-bottom: 28px;
            display: inline-block;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            display: block;
            padding: 13px 20px;
            background: rgba(255, 255, 255, 0.08);
            color: #f8fafc;
            text-decoration: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.2s ease;
        }
        .btn:hover {
            background: #38bdf8;
            color: #0f172a;
            font-weight: 600;
            transform: scale(1.02);
        }
        footer {
            margin-top: 32px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar">🚀</div>
        <h1>Welcome to My Space</h1>
        <p class="bio">这是我部署在 GitHub 上的第一个数字空间。<br>探索技术，记录生活。</p>
        
        <div class="clock" id="clock">00:00:00</div>

        <div class="links">
            <a href="https://github.com" target="_blank" class="btn">📦 访问我的 GitHub</a>
            <a href="https://google.com" target="_blank" class="btn">🔍 Google 搜索</a>
            <a href="mailto:example@example.com" class="btn">✉️ 给我发邮件</a>
        </div>

        <footer>
            © <span id="year"></span> Powered by GitHub Pages
        </footer>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString('zh-CN', { hour12: false });
        }
        setInterval(updateClock, 1000);
        updateClock();
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
